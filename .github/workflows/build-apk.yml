name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk dziennik-fbw.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dziennik-fbw-apk
          path: dziennik-fbw.apk

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dziennik-fbw.apk \
            --title "Dziennik FBW – wersja ${GITHUB_RUN_NUMBER}" \
            --notes "Pobierz dziennik-fbw.apk i zainstaluj. Nowa wersja instaluje się jako aktualizacja, dane zostają."
