plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'pl.mariusz.dziennikfbw'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.mariusz.dziennikfbw'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Fixed key kept in the repo so every new build installs as an update (data is kept)
    signingConfigs {
        release {
            storeFile file('fbw.keystore')
            storePassword 'dziennikfbw'
            keyAlias 'fbw'
            keyPassword 'dziennikfbw'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
