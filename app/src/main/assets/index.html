<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11130e">
<title>Dziennik Balance FBW</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column gym logbook, sticky header, bottom tab bar; version codes are the loudest element on screen */
:root{
  --bg:#f2f3ec; --surface:#ffffff; --surface2:#e8eadf; --fg:#1b1d16; --muted:#666b58; --line:#d6d9ca;
  --accent:#4b5d1f; --accent-fg:#ffffff;
  --hd:#c2410c; --hc:#a86a0c; --vc:#0f766e; --vd:#2457c5; --ok:#3f7a1e; --warn:#b45309;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11130e; --surface:#1a1d15; --surface2:#24281e; --fg:#eceee3; --muted:#9ba08b; --line:#2f3429;
  --accent:#a8bd6b; --accent-fg:#11130e;
  --hd:#ff8352; --hc:#f2b544; --vc:#34d6bd; --vd:#82a9ff; --ok:#8fcf5c; --warn:#f2b544; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11130e; --surface:#1a1d15; --surface2:#24281e; --fg:#eceee3; --muted:#9ba08b; --line:#2f3429;
  --accent:#a8bd6b; --accent-fg:#11130e;
  --hd:#ff8352; --hc:#f2b544; --vc:#34d6bd; --vd:#82a9ff; --ok:#8fcf5c; --warn:#f2b544; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.cloud{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.err{background:var(--hd)} .dot.sync{background:var(--hc)}

main{display:flex;flex-direction:column;gap:18px;padding-top:16px}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* next-training hero */
.hero{display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.trname{font-family:var(--display);font-weight:800;font-size:64px;line-height:.85;letter-spacing:.01em}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip .wk{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
button.day{border:1px solid var(--line);font:inherit;font-size:12px;font-weight:700;padding:0}
.day{border-radius:8px;background:var(--surface2);min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.day span{font-size:9px;font-weight:600;letter-spacing:.06em;opacity:.8}
.day.tr{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.day.done{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:transparent;color:var(--fg)}
.day.next{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.notice{background:var(--surface2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.ex-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.ex-head > div{min-width:0}
.ex-name{font-weight:700;font-size:17px;line-height:1.2;margin:2px 0 4px}
.ex-pl{font-size:14px;font-weight:500;margin:-2px 0 6px;color:var(--fg);opacity:.85}
.ex-meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.ex-meta a{font-weight:600;text-decoration:none}
.ver{--c:var(--muted);font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.03em;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);
  border-radius:10px;padding:6px 10px 4px;min-width:64px;text-align:center}
.ver small{display:block;font-family:var(--body);font-size:9px;font-weight:700;letter-spacing:.1em;opacity:.85;margin-top:2px}
.v-HD{--c:var(--hd)} .v-HC{--c:var(--hc)} .v-VC{--c:var(--vc)} .v-VD{--c:var(--vd)} .v-LP{--c:var(--accent)}
.vmini{--c:var(--muted);font-family:var(--display);font-weight:800;font-size:15px;color:var(--c);letter-spacing:.04em;
  background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:5px;padding:1px 6px}
.cyc{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.cyc b{font-family:var(--display);font-size:14px;letter-spacing:.04em;color:var(--muted);font-weight:800}
.cyc b.cur{color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.target{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px}
.target > div{background:var(--surface2);border-radius:8px;padding:7px 9px;min-width:0}
.target .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.target .goal .v{color:var(--accent)}
.vpick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.vpick button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px}

.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 14px minmax(0,1fr) 48px;gap:8px;align-items:center}
.set .n{font-size:12px;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set .x{color:var(--muted);text-align:center}
.inp{position:relative}
.inp input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 34px 10px 10px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.inp input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.inp span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.tick{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);font-size:20px;font-weight:800;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.set.done .inp input{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.ex-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;max-width:100%}

.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--hd);color:var(--surface)}
.btn.wide{width:100%}

/* history */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sess-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sess-h b{font-family:var(--display);font-size:22px;font-weight:800}
.sess ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.sess li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:baseline}
.sess li .s{color:var(--muted);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl{overflow-x:auto}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
summary{font-weight:700;cursor:pointer}

/* settings */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.field{display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--fg)}

/* rest timer + tabs */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:640px;margin:0 auto}
.timer{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.timer .t{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:86px}
.timer .t.ready{color:var(--ok)} .timer .t.over{color:var(--hd)}
.timer .info{flex:1;min-width:0;font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--surface2);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.timer button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 12px;font-weight:700}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:12px 4px 10px;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.04em}
nav.tabs button[aria-current="page"]{color:var(--fg);box-shadow:inset 0 3px 0 var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
/* "Nowoczesny" look: graphite + orange */
:root[data-look="modern"]{--bg:#f3f3f4;--surface:#ffffff;--surface2:#e8e8eb;--fg:#17171a;--muted:#686872;--line:#d9d9de;--accent:#e2570f;--accent-fg:#ffffff}
@media (prefers-color-scheme: dark){:root[data-look="modern"]:not([data-theme="light"]){--bg:#121214;--surface:#1b1b1f;--surface2:#26262b;--fg:#ededf0;--muted:#9a9aa3;--line:#2f2f35;--accent:#ff7a2f;--accent-fg:#121214}}
:root[data-look="modern"][data-theme="dark"]{--bg:#121214;--surface:#1b1b1f;--surface2:#26262b;--fg:#ededf0;--muted:#9a9aa3;--line:#2f2f35;--accent:#ff7a2f;--accent-fg:#121214}

/* weight stepper, substitutes, plan editor */
.kgbox{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:3px;align-items:center}
.kgbox .inp input{padding-right:8px;text-align:center}
.stp{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:800;font-size:18px;padding:0}
.set{grid-template-columns:18px minmax(0,1.7fr) 10px minmax(0,1fr) 44px !important;gap:6px !important}
.set .inp input{padding-left:6px;padding-right:22px}
.set .inp span{right:6px}
.subs{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.subs button{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14px}
.subs button small{display:block;color:var(--muted);font-size:12px}
.datebox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.datebox input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.plan-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.plan-item.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.plan-item > div{min-width:0}
.plan-item b{display:block}
.plan-item .row button{white-space:nowrap}
.sbtn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.sbtn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.ed input[type=text],.ed input:not([type]),.ed select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:14px;max-width:100%}
.ed-tr{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-slot{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:6px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ed-slot .row{grid-column:1/-1}
.ed-slot select{width:100%}
.ed-slot input{width:54px;text-align:center}
.ring{--p:0;--c:var(--ok);border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.ready{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;color:var(--fg)}
.ready > div{flex:1;min-width:0}
.mchips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.mchip{--c:var(--ok);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:var(--fg);background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:4px}
.scale i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--hd),var(--hc),var(--ok))}
.fc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.fc > div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.rtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rtile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rbar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.rbar i{display:block;height:100%}

.wbox{display:flex;flex-direction:column;gap:8px}
.wrun{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.wrun b{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.wrun.paused b{color:var(--muted)}
.lmode{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;margin:2px 0 6px}
.lmode button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.lmode button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rir{display:flex;align-items:center;gap:4px;padding-left:24px;font-size:12px;color:var(--muted);margin-top:-2px}
.rir button{min-width:34px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}
.rir button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* compact layout */
:root{--gold:#b8860b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#f5c542}}
:root[data-theme="dark"]{--gold:#f5c542}
body{font-size:14px;line-height:1.4}
main{gap:12px;padding-top:10px}
header.top{padding-block:10px 8px}
.brand{font-size:22px}
.brand small{font-size:10px;margin-bottom:2px}
h2{font-size:19px}
.hero{gap:8px}
.trname{font-size:44px}
.chip{padding:5px 12px;font-size:13px}
.day{min-height:30px;font-size:11px}
.strip{gap:3px}
.ex{padding:11px;gap:8px}
.ex-name{font-size:15px;margin:0 0 2px;background:none;border:0;padding:0;text-align:left;color:var(--fg);font-weight:700;cursor:pointer}
.ex-name::after{content:" 📈";font-size:12px;opacity:.6}
.ex-pl{font-size:13px;margin:0 0 4px}
.ex-meta{font-size:12px}
.ver{font-size:26px;padding:5px 8px 3px;min-width:54px}
.target{gap:6px;font-size:12px}
.target > div{padding:5px 7px}
.target .v{font-size:13px}
.sets{gap:5px}
.inp input{font-size:15px;padding-block:7px}
.stp{height:36px;font-size:16px}
.tick{height:36px;font-size:17px}
.btn{padding:11px 15px;font-size:15px}
.notice{padding:10px 12px;font-size:13px}
.datebox,.wrun,.ready{padding:8px 12px}
.wrun b{font-size:24px}
.timer .t{font-size:28px}
nav.tabs button{padding:10px 4px 8px;font-size:12px}
.sess{padding:10px 12px}
.sess-h b{font-size:19px}
body.kb{padding-bottom:calc(60vh + env(safe-area-inset-bottom,0px))}
.set.pr .inp input{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;color:var(--gold)}
.set.pr .n{color:var(--gold)}
.prstar{color:var(--gold);font-weight:800}
.chart{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.chart svg{width:100%;height:auto;display:block}
.chart .lg{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.chart .lg button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:2px 9px;font-weight:700;font-size:12px}
.chart .lg button[aria-pressed="true"]{border-color:currentColor}
.summary{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sumgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.sumgrid > div{background:var(--surface2);border-radius:8px;padding:7px 4px;min-width:0}
.sumgrid b{display:block;font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sumgrid span{font-size:11px;color:var(--muted)}
.rename{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.rename input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px;font-size:14px}
.rbtn{all:unset;display:block;width:100%;cursor:pointer}
.rbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctimer{padding-block:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ctimer .ct-main{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ctimer b{font-family:var(--display);font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ctimer.k-work b{color:var(--hd)} .ctimer.k-rest b{color:var(--vc)} .ctimer.k-steady b{color:var(--accent)} .ctimer.paused b{color:var(--muted)}
body.ct{padding-bottom:calc(270px + env(safe-area-inset-bottom,0px))}
.ex.cardio{border-style:dashed}
.ex.cardio.cdone{border-style:solid;border-color:var(--ok)}
.csel{font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 8px;color:var(--fg);max-width:100%}
.cfg{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px}
.cf{display:flex;align-items:center;gap:4px}
.cf span,.cf em{color:var(--muted);font-style:normal}
.cf input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px;font-size:14px;text-align:center}
.cres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.cres .inp input{padding:7px 4px;text-align:center;font-size:14px}
.cres .inp span{position:static;transform:none;display:block;text-align:center;font-size:10px;margin-top:2px}
.ex.cardio .tick{width:100%;font-size:14px}
.pprev{width:100%;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.pprev p{margin:0}
.pprev ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.hrow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px}
.hrow .link{font-size:13px}
.nextline{font-size:12px;color:var(--muted)}
.pseg{margin-top:-4px}
.pgroup{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pgroup > summary{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0;list-style:none;display:flex;justify-content:space-between}
.pgroup > summary::after{content:"▾"}
.pgroup[open] > summary::after{content:"▴"}
.pgroup > summary::-webkit-details-marker{display:none}
.pgroup[open]{gap:8px}
.pgroup .plan-item{margin-bottom:8px}
.onb{display:flex;flex-direction:column;gap:12px}
.onb h2{font-size:24px}
.onb .opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;color:var(--fg)}
.onb .opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.onb .opt small{color:var(--muted);font-size:12px}
.onb ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.legend{font-size:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface2);border-radius:8px;padding:8px 10px}
.legend div{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;align-items:baseline}
.infob{background:none;border:0;padding:0 2px;color:var(--accent);font-weight:700;font-size:13px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

// default muscle profile for user-made exercises, by movement pattern
const PAT_MUSCLES={vpush:pm('barki:1 triceps:.5'),vpull:pm('plecy:1 biceps:.5'),hpush:pm('klatka:1 triceps:.6 barki:.4'),hpull:pm('plecy:1 biceps:.4 kaptury:.3'),knee:pm('czworoglowe:1 posladki:.7'),hip:pm('dwuglowe:1 posladki:.9 plecy:.4'),iso:{}};
function musclesMap(exId){return EX_MUSCLES[exId]||(S.customEx&&S.customEx[exId]&&(S.customEx[exId][6]||PAT_MUSCLES[S.customEx[exId][1]]))||{}}
const musclesOf=exId=>Object.entries(musclesMap(exId)).filter(([,w])=>w>=.5).map(([m])=>m);
// alternatives: same primary muscle(s), ranked by muscle-profile similarity (+ bonus for same pattern)
function alternativesFor(exId){
  const a=musclesMap(exId), e=EXA(exId)||[], pat=e[1];
  const vals=Object.values(a);
  if(!vals.length) return allExIds().filter(id=>id!==exId&&EXA(id)[1]===pat).map(id=>({id,match:0}));
  const max=Math.max(...vals), prim=Object.keys(a).filter(m=>a[m]===max);
  const norm=w=>Math.sqrt(Object.values(w).reduce((s,x)=>s+x*x,0))||1, na=norm(a);
  return allExIds().filter(id=>id!==exId).map(id=>{
    const b=musclesMap(id); if(!prim.some(m=>(b[m]||0)>=.7)) return null;
    let dot=0; for(const m of Object.keys(a)) dot+=a[m]*(b[m]||0);
    const cos=dot/(na*norm(b));
    return {id,match:Math.round(cos*100),rank:cos+(EXA(id)[1]===pat?.1:0)};
  }).filter(x=>x&&x.match>=55).sort((x,y)=>y.rank-x.rank);
}
// training load per muscle for one session (sets × muscle weight × version factor)
function sessionLoad(s){
  if(s._load) return s._load;
  const out=Object.fromEntries(MUSCLES.map(m=>[m,0]));
  for(const it of s.items){
    const n=it.sets.length||3, f=VER_FACTOR[it.ver]||1; // finished without logging still counts as done
    for(const [m,w] of Object.entries(musclesMap(it.exId))) if(m in out) out[m]+=n*w*f;
  }
  Object.defineProperty(s,'_load',{value:out,enumerable:false,configurable:true});
  return out;
}
function fatigueAt(m,at){
  let f=0;
  for(const s of SESS){const h=(at-s.date)/36e5; if(h<0||h>240) continue; f+=sessionLoad(s)[m]*Math.exp(-h/TAU[m]);}
  return f;
}
function recovery(now=Date.now()){
  return MUSCLES.map(m=>{
    const pct=Math.max(0,Math.min(100,Math.round(100-fatigueAt(m,now)/CAP*100)));
    let hoursTo90=0;
    if(pct<90){for(let h=1;h<=240;h++){if(100-fatigueAt(m,now+h*36e5)/CAP*100>=90){hoursTo90=h;break}}}
    let lastHit=null; for(let i=SESS.length-1;i>=0;i--){if(sessionLoad(SESS[i])[m]>0&&SESS[i].date<=now){lastHit=SESS[i].date;break}}
    return {m,pct,hoursTo90,lastHit};
  });
}
// red → amber → green
function recColor(p){p=Math.max(0,Math.min(100,p));
  if(p<=50) return `color-mix(in srgb, var(--hc) ${Math.round(p/50*100)}%, var(--hd))`;
  if(p<=90) return `color-mix(in srgb, var(--ok) ${Math.round((p-50)/40*100)}%, var(--hc))`;
  return 'var(--ok)';
}
function ring(p,size,label){return `<div class="ring" style="--p:${p};--c:${recColor(p)};width:${size}px;height:${size}px" role="img" aria-label="${label||'Gotowość'} ${p}%"><span>${p}%</span></div>`}

const CARDIO_EX=[['c_tread','Bieżnia',7],['c_run','Bieg na zewnątrz',8.5],['c_bike','Rower stacjonarny',6],['c_ellip','Orbitrek',5.5],['c_row','Wioślarz',7],['c_stairs','Stepper / schody',8],['c_rope','Skakanka',10],['c_swim','Pływanie',7],['c_walk','Marsz',4]];
const C_MET={}; for(const [id,name,met] of CARDIO_EX){EX[id]=[name,'cardio','','',3];C_MET[id]=met}
const CMODES={HIIT:'HIIT · interwały',LISS:'LISS · stałe tempo',MIX:'MIX · LISS + HIIT'};
const CDEF={HIIT:{rounds:8,work:60,rest:60},LISS:{min:20},MIX:{lissMin:10,rounds:3,work:60,rest:60}};
function cTotalSec(c){const N=+c.rounds||0,W=+c.work||0,R=+c.rest||0,h=N*(W+R)-(N>0?R:0);return c.mode==='LISS'?(+c.min||0)*60:c.mode==='MIX'?(+c.lissMin||0)*60+h:h}
function lastCardio(c){for(let i=SESS.length-1;i>=0;i--){const a=(SESS[i].cardio||[]).find(x=>x.key===c.key||(x.exId===c.exId&&x.mode===c.mode));if(a)return Object.assign({date:SESS[i].date},a)}return null}
// suggestion = plan target moved forward from last time: LISS +2 min, HIIT +1 round, run-walk +work seconds after a full set
function cSuggest(slot){
  const t=Object.assign({},CDEF[slot.mode],slot.target||{}), c={key:slot.key,exId:slot.exId,mode:slot.mode,rounds:t.rounds,work:t.work,rest:t.rest,min:t.min,lissMin:t.lissMin};
  const l=lastCardio(c);
  if(l&&l.mode===c.mode){
    if(c.mode==='LISS') c.min=Math.min(t.maxMin||60,Math.max(t.min,Math.round((+l.min||+l.tmin||0)+2)));
    else{
      if(t.progWork){c.rounds=+l.rounds||t.rounds;c.rest=+l.rest||t.rest;c.work=(+l.roundsDone>=(+l.rounds||t.rounds))?(+l.work||t.work)+t.progWork:(+l.work||t.work);c.work=Math.min(c.work,t.maxWork||c.work)}
      else{c.work=+l.work||t.work;c.rest=+l.rest||t.rest;c.rounds=Math.min(t.maxRounds||20,Math.max(t.rounds,(+l.roundsDone||0)+1))}
      if(c.mode==='MIX') c.lissMin=Math.max(t.lissMin,+l.lissMin||0);
    }
  }
  return Object.assign(c,{wl:t.wl||'',rl:t.rl||'',tmin:'',km:'',hr:'',kcal:'',roundsDone:'',done:false,extra:!!slot.extra});
}
function cDesc(c){const p=[];if(c.mode!=='LISS'&&c.rounds)p.push((c.mode==='MIX'?(c.lissMin||0)+' min + ':'')+(c.roundsDone!==undefined&&c.roundsDone!==''?c.roundsDone:c.rounds)+'× '+fmtClock((+c.work||0)*1000)+'/'+fmtClock((+c.rest||0)*1000));if(+c.tmin)p.push(fmt(+c.tmin)+' min');if(+c.km)p.push(fmt(+c.km)+' km');if(+c.hr)p.push(c.hr+' bpm');return exName(c.exId)+' · '+c.mode+(p.length?' · '+p.join(' · '):'')}
// calorie estimates (MET × kg × h); user-entered kcal always wins
function bwOr(s){return Number((s&&s.bw)||S.settings.bw||0)||80}
function cardioKcal(c,bw){if(+c.kcal>0)return Math.round(+c.kcal);const m=+c.tmin||0;if(!m)return 0;const f=c.mode==='HIIT'?1.35:c.mode==='MIX'?1.15:1;return Math.round((C_MET[c.exId]||6)*f*bw*m/60)}
function strengthKcal(s){if(!s.items.length)return 0;const sets=s.items.reduce((a,it)=>a+Math.max(it.sets.length,3),0),cmin=(s.cardio||[]).reduce((a,c)=>a+(+c.tmin||0),0);
  const est=(sets||s.items.length*3)*2.5, byDur=s.dur?s.dur/60000-cmin:0, min=byDur>=(sets||1)*1.5?byDur:est;return Math.round(5*bwOr(s)*min/60)}
function sessKcal(s){const bw=bwOr(s);return strengthKcal(s)+(s.cardio||[]).reduce((a,c)=>a+cardioKcal(c,bw),0)}
function cPlan(id,name,note,trs,schedule){const trainings={};for(const [tr,list] of Object.entries(trs))trainings[tr]=list.map(([ex,mode,target])=>({key:id+':'+tr+':'+mode,ex,cardio:mode,target,sets:0,cy:['LP']}));BUILTIN.push({id,builtin:true,name,note,trNames:Object.keys(trs),trainings,schedule})}
cPlan('csz','Cardio wg Szostka','Z e-booka. HIIT: wysiłek 10/10, 1 min pracy i 1 min odpoczynku, 10–20 min (co trening +1 runda). LISS: wysiłek 5/10, stałe tempo 15–30 min (co trening +2 min). MIX: 10 min LISS + 5 min HIIT.',
  {HIIT:[['c_bike','HIIT',{rounds:5,work:60,rest:60,maxRounds:10}]],LISS:[['c_tread','LISS',{min:15,maxMin:30}]],MIX:[['c_tread','MIX',{lissMin:10,rounds:3,work:60,rest:60}]]},[['HIIT',0,'LISS',0,'MIX',0,0]]);

  {Bieg:[['c_run','HIIT',{rounds:8,work:60,rest:120,progWork:15,maxWork:300,wl:'BIEG',rl:'MARSZ'}]]},[['Bieg',0,'Bieg',0,'Bieg',0,0]]);

/* ---------- cloud sync (only inside claude.ai; the APK keeps data on the phone) ---------- */
let db=null, uid=null, q=Promise.resolve(), cloudState='local';
function setCloud(st){
  const dot=document.getElementById('cloudDot'), t=document.getElementById('cloudTxt');
  dot.className='dot'+(st==='cloud'?' ok':st==='error'?' err':st==='sync'?' sync':' ok');
  t.textContent=st==='cloud'?'Zapisane w chmurze':st==='sync'?'Synchronizuję…':st==='error'?'Brak połączenia – zapis lokalny':'Zapis na telefonie';
  cloudState=st;
}
const prof=()=>db.doc('data/users/'+uid+'/profile');
function cloudDo(fn){
  if(!db) return;
  setCloud('sync');
  q=q.then(fn).then(()=>setCloud('cloud')).catch(e=>{console.warn(e);setCloud('error')});
}
function persist(){S.updatedAt=Date.now();lsSave();cloudDo(()=>prof().set({state:S}));}
async function initCloud(){
  if(!window.claude||!window.claude.use){setCloud('local');return}
  try{
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u){setCloud('local');return}
    const id=await u.id(); if(!id){setCloud('local');return}
    db=d; uid=id; setCloud('sync');
    const [ps,qs]=await Promise.all([prof().get(),prof().collection('sessions').limit(1000).get()]);
    const rs=ps.exists?(ps.data().state||null):null;
    const deleted=new Set([...(S.deleted||[]),...((rs&&rs.deleted)||[])]);
    const map=new Map();
    for(const s of SESS) map.set(s.id,s);
    const remoteIds=new Set();
    for(const d2 of qs.docs){const s=d2.data(); remoteIds.add(s.id); map.set(s.id,s);}
    const localNewer=!rs||(S.updatedAt||0)>(rs.updatedAt||0);
    if(!localNewer) S=Object.assign({},S,JSON.parse(JSON.stringify(rs)));
    S.deleted=[...deleted]; normalize();
    SESS=[...map.values()].filter(s=>!deleted.has(s.id)).sort((x,y)=>x.date-y.date);
    lsSave(); applyLook(); render();
    for(const s of SESS) if(!remoteIds.has(s.id)) cloudDo(()=>prof().collection('sessions').doc(s.id).set(s));
    for(const idd of deleted) if(remoteIds.has(idd)) cloudDo(()=>prof().collection('sessions').doc(idd).delete());
    if(localNewer&&(S.updatedAt||SESS.length)) cloudDo(()=>prof().set({state:S}));
    else setCloud('cloud');
  }catch(e){console.warn(e);setCloud('error')}
}

function effKg(exId,kg,bw){bw=bw==null?Number(S.settings.bw||0):bw;return (loadKind(exId)&&bw>0&&!isNaN(kg))?bw+kg:null}
const rirTxt=r=>(r===undefined||r===null||r==='')?'':' RIR '+r;
function shortKg(kg){return isNaN(kg)?'?':kg<0?'as.'+fmt(-kg):fmt(kg)}
function goalTxt(exId,g){if(g===null)return 'pierwszy raz';if(assistMode(exId)||g<0)return g>=0?'bez asysty':'≤ '+fmt(-g)+' kg asysty';return '≥ '+(loadKind(exId)===1?'+':'')+fmt(g)+' kg'}

// best kg for exercise+version in sessions before index `upto` (default: all saved sessions)
function bestBefore(exId,ver,upto){let b=-Infinity;const n=upto==null?SESS.length:upto;for(let i=0;i<n;i++)for(const it of SESS[i].items)if(it.exId===exId&&it.ver===ver)for(const x of it.sets)if(!isNaN(x.kg)&&x.kg>b)b=x.kg;return b}
function sessPRs(k){const s=SESS[k],out=[];for(const it of s.items){const prev=bestBefore(it.exId,it.ver,k);if(!isFinite(prev))continue;const m=Math.max(...it.sets.map(x=>isNaN(x.kg)?-Infinity:x.kg));if(isFinite(m)&&m>prev)out.push({exId:it.exId,ver:it.ver,kg:m,prev})}return out}
function sessLoad(s){let sets=0,ton=0;for(const it of s.items)for(const x of it.sets){sets++;const kg=loadKind(it.exId)?effKg(it.exId,x.kg,s.bw||null):x.kg;if(kg>0&&x.reps>0)ton+=kg*x.reps}return {sets,ton}}
function lastFor(exId,ver){
  for(let i=SESS.length-1;i>=0;i--){const it=SESS[i].items.find(x=>x.exId===exId&&x.ver===ver);
    if(it){let best=null;for(const s of it.sets){if(!isNaN(s.kg)&&(best===null||s.kg>best.kg||(s.kg===best.kg&&s.reps>best.reps)))best=s}
      if(best) return {kg:best.kg,reps:best.reps,rir:best.rir,date:SESS[i].date,bw:SESS[i].bw}}}

}
function repRange(it){if(it.reps)return it.sets.length+' × '+it.reps;if(!REP_OPTS[it.ver])return (VERS[it.ver]||VERS.LP).reps;return S.repPick[it.exId+'|'+it.ver]||REP_DEF[it.ver]}
function itemInc(it){return it&&it.inc!=null?Number(it.inc):Number(S.settings.inc||1.25)}
// "Add weight every N trainings": executions of an exercise are grouped in blocks of N; a version gets +inc only
// when its previous execution was in an earlier block. N=1 = literal PDF rule (+inc on every return to a version).
// Applies to every plan (linear plans have a 1-step cycle, so N=1 = +inc every session). N=0 = never add weight.
function everyN(){const v=parseInt(S.settings.every,10);return isNaN(v)?4:Math.max(0,v)}
function incFor(it){const base=itemInc(it);

function draftHasData(){return !!DRAFT&&(!!DRAFT.startedAt||DRAFT.items.some(it=>it.sets.some(s=>s.done||s.kg!==''||s.reps!==''))||(DRAFT.cardio||[]).some(c=>c.done||c.tmin!==''||c.km!==''))}

/* ---------- views ---------- */
function chartSVG(exId,sel){
  const VS=['HD','VC','HC','VD','LP'], series={};
  for(const s of SESS)for(const it of s.items)if(it.exId===exId){const m=Math.max(...it.sets.map(x=>isNaN(x.kg)?-Infinity:x.kg));if(isFinite(m))(series[it.ver]=series[it.ver]||[]).push({t:s.date,kg:m})}
  const have=VS.filter(v=>series[v]);
  if(!have.length) return `<div class="chart"><span class="muted" style="font-size:13px">Brak zapisanych ciężarów. Wykres pojawi się po pierwszym treningu z tym ćwiczeniem.</span></div>`;
  if(!series[sel]) sel=have[0];
  const pts=have.flatMap(v=>series[v]), W=320,H=150,L=40,R=10,T=12,B=22;
  let t0=Math.min(...pts.map(p=>p.t)),t1=Math.max(...pts.map(p=>p.t)); if(t1===t0){t0-=864e5;t1+=864e5}
  let y0=Math.min(...pts.map(p=>p.kg)),y1=Math.max(...pts.map(p=>p.kg)); const pad=Math.max(2.5,(y1-y0)*.15); y0-=pad; y1+=pad;
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const ticks=[0,.5,1].map(f=>y0+(y1-y0)*f);
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-5}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--muted)">${shortKg(Math.round(v*4)/4)}</text>`).join('');
  g+=`<text x="${L}" y="${H-5}" font-size="10" style="fill:var(--muted)">${dstr(t0+(pts.length===1?864e5:0))}</text><text x="${W-R}" y="${H-5}" text-anchor="end" font-size="10" style="fill:var(--muted)">${dstr(t1-(pts.length===1?864e5:0))}</text>`;
  for(const v of have.filter(v=>v!==sel).concat(sel)){const a=series[v],on=v===sel,c=`var(--${v.toLowerCase()})`;
    if(a.length>1) g+=`<polyline fill="none" style="stroke:${c};opacity:${on?1:.3}" stroke-width="${on?2.5:1.5}" stroke-linejoin="round" points="${a.map(p=>X(p.t).toFixed(1)+','+Y(p.kg).toFixed(1)).join(' ')}"/>`;
    if(on) g+=a.map((p,i)=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="${i===a.length-1?4.5:3}" style="fill:${i===a.length-1?c:'var(--surface)'};stroke:${c}" stroke-width="2"/>`).join('');
  }
  const a=series[sel], first=a[0].kg, last=a[a.length-1].kg, d=last-first;
  return `<div class="chart"><div class="lg">${have.map(v=>`<button type="button" class="vmini v-${v}" data-act="chartVer" data-ex="${exId}" data-v="${v}" aria-pressed="${v===sel}">${v} · ${series[v].length}×</button>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ciężar w czasie, wersja ${sel}">${g}</svg>
    <span class="muted" style="font-size:12px">${sel}: ${a.length===1?'jeden trening, '+showKg(exId,last):showKg(exId,first)+' → '+showKg(exId,last)+' ('+(d>=0?'+':'−')+fmt(Math.abs(d))+' kg)'}</span></div>`;
}
function cardioCard(c,ci){

function viewHistory(){
  if(!SESS.length) return `<h2>Historia</h2><div class="empty">Brak zapisanych treningów.<br>Zakończ pierwszy trening, a pojawi się tutaj razem z wersjami i ciężarami.</div>`;

  html+=`<details${ui.hchart?' open':''}><summary>Postępy ćwiczeń</summary><div style="display:flex;flex-direction:column;gap:14px;margin-top:10px">`;
  for(const id of exIds){
    const rows=['HD','VC','HC','VD','LP'].map(v=>{
      const ent=SESS.flatMap(s=>s.items.filter(i=>i.exId===id&&i.ver===v).map(i=>({d:s.date,bw:s.bw,kg:Math.max(...i.sets.map(x=>isNaN(x.kg)?-Infinity:x.kg))}))).filter(x=>isFinite(x.kg));

      <ul>${s.items.map(i=>`<li>${vBadge(i.ver)}<span><span>${esc(exName(i.exId))}</span>${prs.some(r=>r.exId===i.exId&&r.ver===i.ver)?' <span class="prstar">★ rekord</span>':''} <span class="s">${i.sets.length?i.sets.map(x=>shortKg(x.kg)+'×'+(isNaN(x.reps)?'?':x.reps)+rirTxt(x.rir)).join(', '):'zrobione, bez zapisu serii'}</span></span></li>`).join('')}${(s.cardio||[]).map(c=>`<li><span class="vmini v-LP">C</span><span>${esc(cDesc(c))}</span></li>`).join('')}</ul>
      ${ui.delId===s.id?`<div class="row"><span class="muted">Usunąć ten trening? Cykle cofną się o jeden krok.</span><button type="button" class="btn danger" data-act="delYes" data-id="${s.id}">Usuń</button><button type="button" class="btn ghost" data-act="delNo">Anuluj</button></div>`:`<div><button type="button" class="link" data-act="del" data-id="${s.id}">Usuń trening</button></div>`}

function viewRecovery(){
  const rec=recovery(), avg=Math.round(rec.reduce((a,r)=>a+r.pct,0)/rec.length);
  const sorted=[...rec].sort((a,b)=>a.pct-b.pct), tired=sorted.filter(r=>r.pct<85).slice(0,3);
  const fc=[24,48,72].map(h=>{const r=recovery(Date.now()+h*36e5);return Math.round(r.reduce((a,x)=>a+x.pct,0)/r.length)});
  let h=`<div class="ex"><div class="row" style="gap:16px;flex-wrap:nowrap">${ring(avg,92,'Gotowość ogólna')}<div><div class="label">Gotowość ogólna</div><div style="font-family:var(--display);font-size:34px;font-weight:800;color:${recColor(avg)}">${avg}%</div><div style="font-size:14px">${tired.length?'Najbardziej zmęczone: '+tired.map(r=>MUSCLE_NAME[r.m].toLowerCase()).join(', '):'Wszystkie partie gotowe do treningu'}</div></div></div>
    <div class="scale"><span class="muted">zmęczone</span><i></i><span class="muted">gotowe</span></div></div>
  <div class="ex"><div class="label">Prognoza</div><div class="fc">${[['Teraz',avg],['+24 h',fc[0]],['+48 h',fc[1]],['+72 h',fc[2]]].map(([l,v])=>`<div>${ring(v,56,l)}<span class="muted">${l}</span></div>`).join('')}</div></div>
  <div class="rtiles">${sorted.map(r=>`<div class="rtile"><div class="row" style="justify-content:space-between"><b>${MUSCLE_NAME[r.m]}</b><b style="color:${recColor(r.pct)}">${r.pct}%</b></div>
    <div class="rbar"><i style="width:${r.pct}%;background:${recColor(r.pct)}"></i></div>
    <span class="muted" style="font-size:12px">${r.pct>=90?'gotowe':'90% za ~'+(r.hoursTo90>=48?Math.round(r.hoursTo90/24)+' dni':r.hoursTo90+' h')}${r.lastHit?' · ostatnio '+dstr(r.lastHit):''}</span></div>`).join('')}</div>

  return h;
}
function slotLine(sl){
  if(sl.cardio){const t=Object.assign({},CDEF[sl.cardio],sl.target||{});
    return `<li><b>Cardio: ${esc(exName(sl.ex))}</b> · ${sl.cardio} ${sl.cardio==='LISS'?t.min+' min':(sl.cardio==='MIX'?t.lissMin+' min + ':'')+t.rounds+'× '+fmtClock(t.work*1000)+'/'+fmtClock(t.rest*1000)}</li>`}
  const how=sl.reps?`${sl.sets} × ${esc(sl.reps)}`:`${sl.sets} ${sl.sets===1?'seria':sl.sets<5?'serie':'serii'} · ${sl.cy.join(' › ')}`;
  return `<li><b>${esc(exName(sl.ex))}</b> · ${how}<div class="muted" style="font-size:12px">${esc(exPL(sl.ex))}</div></li>`}
function planPreview(x){

  return `<div class="pprev">${x.note?`<p>${esc(x.note)}</p>`:''}<div class="muted" style="font-size:12px">${rot}</div>

/* ---------- rest timer ---------- */
let T=null, tInt=null, actx=null;
function beep(f){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.35);o.start();o.stop(actx.currentTime+.36)}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function startTimer(ver){
  const v=VERS[ver]; T={start:Date.now(),min:v.min,max:v.max,ver,b1:false,b2:false};
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  $('#timer').hidden=false; clearInterval(tInt); tInt=setInterval(tick,250); tick();
}
function tick(){
  if(!T) return;
  const s=Math.floor((Date.now()-T.start)/1000), el=$('#tT');
  el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  el.className='t'+(s>=T.max+30?' over':s>=T.min?' ready':'');
  $('#tInfo').textContent=`Przerwa ${T.ver}: ${VERS[T.ver].rest}`+(s>=T.min?' · możesz zaczynać':'');
  $('#tBar').style.width=Math.min(100,s/T.max*100)+'%';
  if(s>=T.min&&!T.b1){T.b1=true;beep(880)}
  if(s>=T.max&&!T.b2&&T.max>T.min){T.b2=true;beep(660)}
}
$('#tStop').addEventListener('click',()=>{T=null;clearInterval(tInt);$('#timer').hidden=true});
$('#tAdd').addEventListener('click',()=>{if(T){T.min+=30;T.max+=30;T.b1=false;T.b2=false;tick()}});
let wake=null;
async function keepAwake(){if(window.Android&&window.Android.keepAwake){try{Android.keepAwake(true)}catch(e){}return}try{if(!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&draftHasData())keepAwake()});

/* ---------- export / import ---------- */
const stamp=()=>isoDay(Date.now());
async function saveFile(name,text,mime){
  if(window.Android&&window.Android.saveFile){try{return String(Android.saveFile(name,text,mime)).indexOf('ok')===0?'ok':'fail'}catch(e){return 'fail'}}
  if(window.claude&&window.claude.use){
    try{const dl=await claude.use('downloads');
      if(dl){try{await dl.save({filename:name,data:new Blob([text],{type:mime})});return 'ok'}
        catch(e){if(e&&e.code==='declined')return 'declined'; if(e&&e.code==='rate_limited')return 'busy'}}
    }catch(e){}
  }
  try{const u=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return 'ok'}
  catch(e){return 'fail'}
}
async function exportJson(){
  const r=await saveFile('dziennik-fbw-'+stamp()+'.json',JSON.stringify({app:'dziennik-fbw',v:2,S,SESS},null,1),'application/json');
  if(r==='ok'){S.lastBackup=Date.now();persist();render();toast('Kopia zapisana w Pobranych')}
  else if(r==='busy') toast('Okno zapisu jest już otwarte');
  else if(r==='fail'){ui.copyFallback=true;render();toast('Nie udało się zapisać pliku. Skopiuj tekst poniżej.')}
}
async function exportCsv(){
  const q2=v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['Data','Trening','Plan','Ćwiczenie','Wersja','Seria','Ciężar kg (ujemny = asysta)','Powtórzenia','RIR','Masa ciała kg','Czas treningu min','Cardio min','Dystans km','Tętno śr.','kcal (szac.)']];
  for(const s of SESS){const d=new Date(s.date).toLocaleDateString('pl-PL'), pn=(allPlans().find(p=>p.id===s.plan)||{}).name||(s.days?s.days+' dni P'+s.prio:'');
    for(const it of s.items) it.sets.forEach((x,i)=>rows.push([d,s.tr,pn,exName(it.exId),it.ver,i+1,isNaN(x.kg)?'':fmt(x.kg),isNaN(x.reps)?'':x.reps,x.rir==null?'':x.rir,s.bw?fmt(s.bw):'',s.dur?Math.round(s.dur/60000):'','','','','']));
    for(const c of (s.cardio||[])) rows.push([d,s.tr,pn,exName(c.exId),c.mode,'','','','',s.bw?fmt(s.bw):'',s.dur?Math.round(s.dur/60000):'',c.tmin==null?'':fmt(c.tmin),c.km==null?'':fmt(c.km),c.hr==null?'':c.hr,cardioKcal(c,bwOr(s))]);}
  const r=await saveFile('dziennik-fbw-'+stamp()+'.csv','﻿'+rows.map(r=>r.map(q2).join(';')).join('\r\n'),'text/csv');
  if(r==='ok') toast('Plik CSV zapisany w Pobranych'); else if(r==='fail') toast('Nie udało się zapisać pliku');
}
function importData(o){
  if(!o||!o.S||!Array.isArray(o.SESS)) throw 0;
  const old=new Set(SESS.map(s=>s.id)); S=Object.assign(S,o.S); SESS=o.SESS.slice().sort((x,y)=>x.date-y.date);
  S.deleted=[]; normalize(); DRAFT=null; draftSave(); ui.importOpen=false; persist(); applyLook();
  for(const s of SESS) cloudDo(()=>prof().collection('sessions').doc(s.id).set(s));
  for(const id of old) if(!SESS.find(s=>s.id===id)) cloudDo(()=>prof().collection('sessions').doc(id).delete());
  toast(`Wczytano kopię: ${SESS.length} treningów`);
}

/* ---------- plan editing ---------- */
function editPlan(){return S.plans.find(x=>x.id===ui.edit)}
function afterPlanChange(){if(ui.edit===S.activePlan) resetDraftIfEmpty(); persist()}
function dupPlan(src){
  const order=src.schedule?src.schedule.flat().filter(Boolean):(src.order||src.trNames);
  // collapse a 2-week schedule to the shortest repeating rotation
  let rot=order; for(let n=1;n<=order.length;n++){if(order.length%n===0&&order.every((t,i)=>t===order[i%n])){rot=order.slice(0,n);break}}
  return {id:rid('p'),name:src.name+' (moja)',trNames:src.trNames.slice(),trainings:JSON.parse(JSON.stringify(src.trainings)),order:rot,note:src.note||''};
}

function finish(){
  const items=DRAFT.items.map(it=>({key:it.key,exId:it.exId,ver:it.ver,sets:it.sets.filter(s=>s.done||(s.kg!==''&&s.reps!=='')).map(s=>{const o={kg:num(s.kg),reps:num(s.reps)}; if(s.rir!==''&&s.rir!=null) o.rir=+s.rir; return o})}));
  const s=seq(), L=s.length, cur=S.seqPos%L;
  let step=1; if(s[cur]!==DRAFT.tr){for(let k=1;k<=L;k++){if(s[(cur+k)%L]===DRAFT.tr){step=k+1;break}}}
  const when=DRAFT.date?new Date(DRAFT.date+'T12:00').getTime():Date.now();
  const p=plan();
  const sess={id:rid('s'),date:when,tr:DRAFT.tr,plan:p.id,days:p.days,prio:p.prio,seqStep:step,items};
  const cardio=(DRAFT.cardio||[]).filter(c=>c.done||c.tmin!==''||c.km!=='').map(c=>{const o={key:c.key,exId:c.exId,mode:c.mode};
    for(const f of ['rounds','work','rest','min','lissMin','tmin','km','hr','kcal','roundsDone']){const v=num(c[f]);if(!isNaN(v))o[f]=v}
    if(!o.tmin) o.tmin=Math.round(cTotalSec(c)/60); return o});
  if(cardio.length) sess.cardio=cardio;
  if(CT) cEnd(false,true);
  if(DRAFT.startedAt) sess.dur=wElapsed();
  if(Number(S.settings.bw)>0) sess.bw=Number(S.settings.bw);
  for(const it of items) S.cycles[it.key]=(S.cycles[it.key]||0)+1;
  S.seqPos+=step;
  SESS.push(sess); SESS.sort((x,y)=>x.date-y.date);
  persist(); cloudDo(()=>prof().collection('sessions').doc(sess.id).set(sess));
  DRAFT=null; draftSave(); ui={}; try{wake&&wake.release()}catch(e){} try{window.Android&&Android.keepAwake&&Android.keepAwake(false)}catch(e){}
  ui.summary=sess.id; ensureDraft(); render(); window.scrollTo(0,0);
}

    case 'edAddCardio': {const p=editPlan(), t=p.trNames[+el.dataset.t]; p.trainings[t].push({key:rid('k'),ex:'c_tread',cardio:'LISS',target:{min:20},sets:0,cy:['LP']}); afterPlanChange(); break}
    case 'edAddSlot': {const p=editPlan(), t=p.trNames[+el.dataset.t]; p.trainings[t].push({key:rid('c'),ex:'flat',sets:3,cy:['HD','VC','HC','VD']}); afterPlanChange(); break}
    case 'edDelSlot': {const p=editPlan(), t=p.trNames[+el.dataset.t]; p.trainings[t].splice(+el.dataset.s,1); afterPlanChange(); break}
    case 'edMove': {const p=editPlan(), arr=p.trainings[p.trNames[+el.dataset.t]], s=+el.dataset.s, d=+el.dataset.d, j=s+d; if(j<0||j>=arr.length) return; [arr[s],arr[j]]=[arr[j],arr[s]]; afterPlanChange(); break}
    case 'nxOpen': ui.newEx=true; break;
    case 'nxCancel': ui.newEx=false; break;
    case 'nxSave': {const name=$('#nx-name').value.trim(); if(!name){toast('Wpisz nazwę ćwiczenia');return}
      const id=rid('x'); S.customEx[id]=[name,$('#nx-pat').value,$('#nx-vid').value.trim(),'',parseInt($('#nx-kind').value,10)||0,$('#nx-pl').value.trim(),$('#nx-mus').value?{[$('#nx-mus').value]:1}:null];
      ui.newEx=false; persist(); toast('Dodano „'+name+'” do bazy ćwiczeń'); break}
    case 'planDel': ui.delPlan=ui.edit; break;
    case 'planDelNo': ui.delPlan=null; break;
    case 'planDelYes': {const id=ui.delPlan; S.plans=S.plans.filter(x=>x.id!==id); if(S.activePlan===id){S.activePlan=BUILTIN[0].id;S.seqPos=0;resetDraftIfEmpty()} ui.edit=null; ui.delPlan=null; persist(); toast('Plan usunięty'); break}
    case 'look': S.settings.look=el.dataset.v; applyLook(); persist(); break;
    case 'mode': S.settings.mode=el.dataset.v; applyLook(); persist(); break;
    case 'copy': {const txt=JSON.stringify({S,SESS});
      if(window.Android&&window.Android.copy){try{Android.copy(txt);toast('Skopiowano dane');return}catch(err){}}
      try{navigator.clipboard.writeText(txt).then(()=>toast('Skopiowano dane'),()=>{ui.copyFallback=true;render();toast('Zaznacz tekst poniżej i skopiuj')})}catch(err){ui.copyFallback=true;render()} return}
    case 'importShow': ui.importOpen=!ui.importOpen; break;
    case 'importDo': {try{importData(JSON.parse($('#impTxt').value))}catch(err){toast('To nie wygląda na kopię z tego dziennika')} break}
    case 'exportJson': exportJson(); return;
    case 'exportCsv': exportCsv(); return;
    case 'reset': ui.resetAsk=true; break;
    case 'resetNo': ui.resetAsk=false; break;
    case 'resetYes': {const ids=SESS.map(s=>s.id); S.cycles={};S.seqPos=0;S.swaps={};S.deleted=[...(S.deleted||[]),...ids];SESS=[];DRAFT=null;draftSave();ui.resetAsk=false;persist();
      for(const id of ids) cloudDo(()=>prof().collection('sessions').doc(id).delete()); toast('Dziennik wyzerowany'); break}
    default: return;
  }
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.c!=null&&DRAFT&&DRAFT.cardio){const c=DRAFT.cardio[+t.dataset.c]; if(c){if(t.dataset.cf)c[t.dataset.cf]=t.value; if(t.dataset.cr)c[t.dataset.cr]=t.value; draftSave()}}
  if(t.dataset&&t.dataset.f&&DRAFT){let v=t.value; if(t.dataset.f==='kg'&&t.dataset.as==='1'){v=v.trim().replace(/^-/,''); if(v!==''&&num(v)!==0) v='-'+v}
    DRAFT.items[+t.dataset.i].sets[+t.dataset.s][t.dataset.f]=v; draftSave()}
  if(t.id==='bw'){const v=num(t.value); S.settings.bw=(v>0&&v<400)?v:null; clearTimeout(t._h); t._h=setTimeout(persist,600)}
  if(t.id==='every'){const v=parseInt(t.value,10); if(v>=0&&v<=20){S.settings.every=v; clearTimeout(t._h); t._h=setTimeout(persist,600)}}
  if(t.id==='inc'){const v=num(t.value); if(v>0){S.settings.inc=v; clearTimeout(t._h); t._h=setTimeout(persist,600)}}
  if(t.dataset&&t.dataset.ed){const p=editPlan(); if(!p) return; const ed=t.dataset.ed;
    if(ed==='name'){p.name=t.value; clearTimeout(t._h); t._h=setTimeout(persist,600)}
    if(ed==='order'){p.order=t.value.split(/[\s,;]+/).filter(Boolean); clearTimeout(t._h); t._h=setTimeout(persist,600)}
    if(ed==='slotSets'){const n=parseInt(t.value,10); if(n>0&&n<=12){p.trainings[p.trNames[+t.dataset.t]][+t.dataset.s].sets=n; clearTimeout(t._h); t._h=setTimeout(afterPlanChange,600)}}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='impFile'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{importData(JSON.parse(fr.result));render()}catch(err){toast('Ten plik nie jest kopią z tego dziennika')}};
    fr.readAsText(t.files[0]); t.value=''; return;
  }
  if(t.dataset&&t.dataset.c!=null&&DRAFT&&DRAFT.cardio){const c=DRAFT.cardio[+t.dataset.c]; if(c){if(t.dataset.cx){c.exId=t.value;draftSave();render();return} if(t.dataset.cf){c[t.dataset.cf]=t.value;draftSave();render();return}}}
  if(t.id==='trDate'&&DRAFT){const today=isoDay(Date.now()); DRAFT.date=(t.value&&t.value!==today)?t.value:null; ui.dateEdit=false; draftSave(); render(); return}
  if(t.dataset&&t.dataset.act==='cycSel'){
    const key=t.dataset.key, cy=t.dataset.cy.split(' '), L=cy.length, n=S.cycles[key]||0;
    S.cycles[key]=n-(n%L)+cy.indexOf(t.value);
    if(DRAFT){ if(!draftHasData()) DRAFT=null; else DRAFT.items.forEach(it=>{if(it.key===key) it.ver=t.value}); draftSave(); }
    persist(); render(); return;
  }
  if(t.dataset&&t.dataset.ed){const p=editPlan(); if(!p) return; const ed=t.dataset.ed, ti=+t.dataset.t;
    if(ed==='trName'){const old=p.trNames[ti], nw=t.value.trim(); if(!nw||nw===old) {render();return} if(p.trNames.includes(nw)){toast('Taki trening już jest');render();return}
      p.trNames[ti]=nw; p.trainings[nw]=p.trainings[old]; delete p.trainings[old]; p.order=(p.order||[]).map(x=>x===old?nw:x); afterPlanChange(); render(); return}
    if(ed==='slotCm'){const sl=p.trainings[p.trNames[ti]][+t.dataset.s]; sl.cardio=t.value; sl.target=Object.assign({},CDEF[t.value]); afterPlanChange(); render(); return}
    if(ed==='slotCt'){const sl=p.trainings[p.trNames[ti]][+t.dataset.s], n=parseInt(t.value,10); sl.target=Object.assign({},CDEF[sl.cardio],sl.target||{}); if(n>=0) sl.target[t.dataset.cfk]=n; afterPlanChange(); return}
    if(ed==='slotEx'){p.trainings[p.trNames[ti]][+t.dataset.s].ex=t.value; afterPlanChange(); return}
    if(ed==='slotCy'){p.trainings[p.trNames[ti]][+t.dataset.s].cy=t.value.split(' '); afterPlanChange(); return}
    if(ed==='order'||ed==='name'){persist(); return}
  }
});

let CT=null, ctInt=null;
function cPhases(c){const ph=[],W=+c.work||0,R=+c.rest||0,N=+c.rounds||0;
  if(c.mode==='LISS') ph.push({k:'steady',sec:(+c.min||0)*60,l:'STAŁE TEMPO'});
  if(c.mode==='MIX') ph.push({k:'steady',sec:(+c.lissMin||0)*60,l:'LISS · STAŁE TEMPO'});
  if(c.mode!=='LISS') for(let r=1;r<=N;r++){ph.push({k:'work',sec:W,l:c.wl||'PRACA',r});if(r<N&&R>0)ph.push({k:'rest',sec:R,l:c.rl||'ODPOCZYNEK',r})}
  return ph.filter(x=>x.sec>0)}
function cStart(ci){const c=DRAFT.cardio[ci], ph=cPhases(c); if(!ph.length){toast('Ustaw czas albo liczbę rund');return}
  T=null; clearInterval(tInt); $('#timer').hidden=true;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  CT={ci,ph,i:0,pe:0,tot:0,last:Date.now(),paused:false};
  keepAwake(); beep(880); document.body.classList.add('ct'); clearInterval(ctInt); ctInt=setInterval(cTick,200); cTick(); render()}
// elapsed is accumulated from wall-clock deltas, so a throttled tick (screen off) catches up phase by phase
function cTick(){if(!CT)return; const now=Date.now(); if(!CT.paused){const d=now-CT.last;CT.pe+=d;CT.tot+=d} CT.last=now;
  let p=CT.ph[CT.i];
  while(p&&CT.pe>=p.sec*1000){CT.pe-=p.sec*1000;CT.i++;p=CT.ph[CT.i];if(p){beep(p.k==='work'?880:p.k==='rest'?520:700);try{navigator.vibrate&&navigator.vibrate(p.k==='work'?[200,100,200]:300)}catch(e){}}}
  if(!p){cEnd(true);return}
  const left=Math.ceil((p.sec*1000-CT.pe)/1000);
  if(left<=3&&left>0&&CT.cd!==CT.i+':'+left&&!CT.paused){CT.cd=CT.i+':'+left;beep(440)}
  const el=$('#ctimer'), works=CT.ph.filter(x=>x.k==='work').length; el.hidden=false;
  el.className='ctimer k-'+p.k+(CT.paused?' paused':'');
  el.innerHTML=`<div class="ct-main"><div><div class="label">${esc(p.l)}${p.r?` · runda ${p.r}/${works}`:''}${CT.paused?' · pauza':''}</div><b>${fmtClock(left*1000)}</b></div><span class="muted">łącznie ${fmtClock(CT.tot)}</span></div>
    <div class="row"><button type="button" class="sbtn" data-act="ctPause">${CT.paused?'▶ Wznów':'⏸ Pauza'}</button><button type="button" class="sbtn" data-act="ctSkip">⏭ Dalej</button><button type="button" class="sbtn" data-act="ctStop">■ Koniec</button></div>`}
function cEnd(full,silent){const c=DRAFT&&DRAFT.cardio&&DRAFT.cardio[CT.ci];
  if(c){c.tmin=fmt(Math.round(CT.tot/6000)/10); if(c.mode!=='LISS') c.roundsDone=String(CT.ph.slice(0,full?CT.ph.length:CT.i).filter(x=>x.k==='work').length); c.done=true; draftSave()}
  clearInterval(ctInt); CT=null; $('#ctimer').hidden=true; document.body.classList.remove('ct');
  if(silent) return;
  beep(990); setTimeout(()=>beep(990),250); try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  render(); toast(full?'Cardio zakończone':'Cardio zatrzymane, czas zapisany')}
let kbT=null;
function keepVisible(el){clearTimeout(kbT);kbT=setTimeout(()=>{try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){el.scrollIntoView()}},280)}
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input:not([type=checkbox]):not([type=file]),textarea')){document.body.classList.add('kb');keepVisible(t)}});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches||!a.matches('input,textarea'))document.body.classList.remove('kb')},150)});
if(window.visualViewport) visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea'))keepVisible(a)});
setInterval(()=>{const el=document.getElementById('wClock'); if(el&&DRAFT&&DRAFT.startedAt&&!DRAFT.pausedAt) el.textContent=fmtClock(wElapsed())},1000);
normalize();
applyLook();
render();
initCloud();
</script>
